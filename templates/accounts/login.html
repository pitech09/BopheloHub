{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">Log in to LearnHub</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100">Log in</button>
                </form>
                <hr>
                <div class="text-center">
                    <p class="mb-2">Don't have an account?</p>
                    <a href="{% url 'register_student' %}" class="btn btn-outline-success w-100 mb-2">
                        <i class="bi bi-person-plus me-1"></i>Sign Up as Student
                    </a>
                    <a href="{% url 'register_instructor' %}" class="btn btn-outline-info w-100">
                        <i class="bi bi-chalkboard-teacher me-1"></i>Sign Up as Instructor
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
