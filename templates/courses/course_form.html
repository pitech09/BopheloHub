{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<h2>{% if form.instance.pk %}Edit{% else %}Create{% endif %} Course</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Save</button>
</form>
{{ form.media }}
{% endblock %}
