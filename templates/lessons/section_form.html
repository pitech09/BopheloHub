{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<h2>Add New Section</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-success">Save Section</button>
    <a href="{% url 'curriculum' course.pk %}" class="btn btn-outline-secondary">Cancel</a>
</form>
{% endblock %}
